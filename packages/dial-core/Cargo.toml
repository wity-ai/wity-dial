[package]
name = "dial-core"
version = "0.1.0"
edition = "2021"
description = "DIAL (Dialectic Interagent Language) — core parser, types, and session context"
license = "MIT"

[lib]
name = "dial_core"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
regex = "1"
